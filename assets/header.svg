<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Animated background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color"
          values="#0d1117;#0a192f;#0d1117;#130d24;#0d1117"
          dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0f3460">
        <animate attributeName="stop-color"
          values="#0f3460;#1a1a2e;#1a0533;#0f3460;#1a1a2e"
          dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a1a2e">
        <animate attributeName="stop-color"
          values="#1a1a2e;#0f3460;#0a192f;#0d1117;#1a1a2e"
          dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glowing orb gradients -->
    <radialGradient id="orb1Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="900" height="300" fill="url(#bgGrad)"/>

  <!-- ─── Glowing orbs ─── -->
  <ellipse cx="180" cy="130" rx="200" ry="130" fill="url(#orb1Grad)">
    <animate attributeName="cx" values="180;220;160;180" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;100;160;130" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="200;240;180;200" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="720" cy="160" rx="170" ry="110" fill="url(#orb2Grad)">
    <animate attributeName="cx" values="720;680;750;720" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;130;190;160" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="170;200;150;170" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="450" cy="260" rx="150" ry="60" fill="url(#orb3Grad)">
    <animate attributeName="ry" values="60;80;50;60" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ─── Floating particles ─── -->
  <circle r="2.5" fill="#58a6ff" filter="url(#softGlow)">
    <animate attributeName="cx" values="80;110;70;80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;30;75;55" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;1;0.8" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#79c0ff">
    <animate attributeName="cx" values="820;790;840;820" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;45;90;70" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.3;0.6" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#a5d6ff" filter="url(#softGlow)">
    <animate attributeName="cx" values="420;460;400;420" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="28;50;18;28" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.3;0.5" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#d2a8ff">
    <animate attributeName="cx" values="650;620;670;650" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;205;250;230" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.9;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#58a6ff">
    <animate attributeName="cx" values="150;180;135;150" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="240;215;260;240" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.4;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#79c0ff" filter="url(#softGlow)">
    <animate attributeName="cx" values="760;740;790;760" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="240;220;265;240" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.4;0.6" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#a5d6ff">
    <animate attributeName="cx" values="300;330;280;300" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;225;185;200" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.3;0.4" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#d2a8ff" filter="url(#softGlow)">
    <animate attributeName="cx" values="560;540;580;560" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;20;55;40" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;1;0.8" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ─── Decorative dot grid (data science theme) ─── -->
  <g opacity="0.12" fill="#58a6ff">
    <circle cx="30"  cy="30"  r="1.2"/><circle cx="60"  cy="30"  r="1.2"/><circle cx="90"  cy="30"  r="1.2"/>
    <circle cx="30"  cy="55"  r="1.2"/><circle cx="60"  cy="55"  r="1.2"/><circle cx="90"  cy="55"  r="1.2"/>
    <circle cx="810" cy="30"  r="1.2"/><circle cx="840" cy="30"  r="1.2"/><circle cx="870" cy="30"  r="1.2"/>
    <circle cx="810" cy="55"  r="1.2"/><circle cx="840" cy="55"  r="1.2"/><circle cx="870" cy="55"  r="1.2"/>
    <circle cx="30"  cy="240" r="1.2"/><circle cx="60"  cy="240" r="1.2"/><circle cx="90"  cy="240" r="1.2"/>
    <circle cx="30"  cy="265" r="1.2"/><circle cx="60"  cy="265" r="1.2"/><circle cx="90"  cy="265" r="1.2"/>
    <circle cx="810" cy="240" r="1.2"/><circle cx="840" cy="240" r="1.2"/><circle cx="870" cy="240" r="1.2"/>
    <circle cx="810" cy="265" r="1.2"/><circle cx="840" cy="265" r="1.2"/><circle cx="870" cy="265" r="1.2"/>
  </g>

  <!-- ─── NAME TEXT ─── -->
  <text x="450" y="120" text-anchor="middle"
        font-family="'Segoe UI', 'Courier New', monospace"
        font-size="58" font-weight="900"
        fill="#ffffff" filter="url(#textGlow)" opacity="0">
    Vaibhav Sudrik
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- ─── Animated underline ─── -->
  <rect x="450" y="130" width="0" height="3" rx="2" fill="#58a6ff" filter="url(#softGlow)" opacity="0">
    <animate attributeName="x" values="450;230" dur="0.9s" begin="1.4s" fill="freeze"/>
    <animate attributeName="width" values="0;440" dur="0.9s" begin="1.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.9" dur="0.9s" begin="1.4s" fill="freeze"/>
  </rect>

  <!-- ─── ROLE TEXT ─── -->
  <text x="450" y="168" text-anchor="middle"
        font-family="'Segoe UI', 'Courier New', monospace"
        font-size="17" font-weight="600"
        fill="#58a6ff" filter="url(#softGlow)" opacity="0">
    🤖 Aspiring Data Scientist  |  AI/ML &amp; Gen AI  |  ☁️ Cloud &amp; Big Data
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- ─── SKILLS TEXT ─── -->
  <text x="450" y="200" text-anchor="middle"
        font-family="'Segoe UI', 'Courier New', monospace"
        font-size="13"
        fill="#79c0ff" opacity="0">
    Python  •  NumPy  •  Pandas  •  SQL  •  Power BI  •  Hadoop  •  Spark  •  AWS  •  DevOps
    <animate attributeName="opacity" values="0;0.9" dur="1s" begin="2.2s" fill="freeze"/>
  </text>

  <!-- ─── Status badge ─── -->
  <rect x="355" y="216" width="190" height="28" rx="14" fill="#161b22" stroke="#1f6feb" stroke-width="1.2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="2.6s" fill="freeze"/>
  </rect>
  <text x="450" y="235" text-anchor="middle"
        font-family="'Segoe UI', monospace" font-size="12" font-weight="600"
        fill="#58a6ff" opacity="0">
    🇮🇳  India  ·  Open to Opportunities
    <animate attributeName="opacity" values="0;1" dur="1s" begin="2.6s" fill="freeze"/>
  </text>

  <!-- ─── Animated bottom wave ─── -->
  <path d="M0,272 Q150,255 300,270 Q450,285 600,268 Q750,252 900,272 L900,300 L0,300 Z"
        fill="#0d1117">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 18,0; -18,0; 0,0" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0,280 Q200,265 400,280 Q600,295 900,278 L900,300 L0,300 Z"
        fill="#0d1117" opacity="0.85"/>
  <path d="M0,290 Q250,278 500,290 Q700,300 900,285 L900,300 L0,300 Z"
        fill="#0d1117"/>
</svg>
