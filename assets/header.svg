<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <!-- Clean dark gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Subtle accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#2f81f7"/>
      <stop offset="70%"  stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle glow for name -->
    <filter id="nameGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft text shadow -->
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- Very subtle top-left geometric accent -->
  <rect x="0" y="0" width="4" height="280" fill="#2f81f7" opacity="0.6"/>
  <rect x="0" y="0" width="900" height="3" fill="#2f81f7" opacity="0.3"/>

  <!-- Subtle grid texture — very faint -->
  <g stroke="#21262d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="70"  x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="225" y1="0" x2="225" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="675" y1="0" x2="675" y2="280"/>
  </g>

  <!-- Subtle radial glow behind name (very soft) -->
  <ellipse cx="450" cy="120" rx="320" ry="100" fill="#2f81f7" opacity="0.03"/>

  <!-- ── NAME ── -->
  <text x="450" y="115"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="2"
        fill="#f0f6fc" filter="url(#nameGlow)"
        opacity="0">
    Vaibhav Sudrik
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- ── Accent Line under name ── -->
  <rect x="225" y="128" width="450" height="2" rx="1" fill="url(#accentLine)" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.8s" begin="1s" fill="freeze"/>
  </rect>

  <!-- ── ROLE TEXT ── -->
  <text x="450" y="162"
        text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="16" font-weight="400" letter-spacing="3"
        fill="#8b949e" filter="url(#softShadow)"
        opacity="0">
    ASPIRING DATA SCIENTIST  ·  AI / ML  ·  GEN AI  ·  CLOUD
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- ── Subtle tag chips ── -->
  <!-- Python -->
  <rect x="218" y="182" width="68" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.9s" fill="freeze"/>
  </rect>
  <text x="252" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff" opacity="0">
    Python
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.9s" fill="freeze"/>
  </text>
  <!-- AWS -->
  <rect x="296" y="182" width="58" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.0s" fill="freeze"/>
  </rect>
  <text x="325" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff" opacity="0">
    AWS
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.0s" fill="freeze"/>
  </text>
  <!-- MLOps -->
  <rect x="364" y="182" width="64" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.1s" fill="freeze"/>
  </rect>
  <text x="396" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff" opacity="0">
    MLOps
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.1s" fill="freeze"/>
  </text>
  <!-- Gen AI -->
  <rect x="438" y="182" width="64" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/>
  </rect>
  <text x="470" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff" opacity="0">
    Gen AI
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/>
  </text>
  <!-- Spark -->
  <rect x="512" y="182" width="56" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.3s" fill="freeze"/>
  </rect>
  <text x="540" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff" opacity="0">
    Spark
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.3s" fill="freeze"/>
  </text>
  <!-- Power BI -->
  <rect x="578" y="182" width="72" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.4s" fill="freeze"/>
  </rect>
  <text x="614" y="197" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff" opacity="0">
    Power BI
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.4s" fill="freeze"/>
  </text>

  <!-- ── Status pill ── -->
  <rect x="348" y="218" width="204" height="26" rx="13"
        fill="#161b22" stroke="#21262d" stroke-width="1"
        opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.7s" fill="freeze"/>
  </rect>
  <!-- Pulsing dot -->
  <circle cx="366" cy="231" r="4" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.7s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="3.3s" repeatCount="indefinite"/>
  </circle>
  <text x="380" y="236"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500"
        fill="#8b949e" opacity="0">
    Open to Opportunities · 🇮🇳 India
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.7s" fill="freeze"/>
  </text>

  <!-- ── Bottom wave transition ── -->
  <path d="M0,252 Q200,238 450,252 Q700,266 900,252 L900,280 L0,280 Z" fill="#0d1117"/>
  <path d="M0,260 Q300,248 600,262 Q780,272 900,258 L900,280 L0,280 Z" fill="#0d1117" opacity="0.9"/>
</svg>
