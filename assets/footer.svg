<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0a192f;#0d1117" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0f3460">
        <animate attributeName="stop-color" values="#0f3460;#1a1a2e;#0f3460" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a1a2e">
        <animate attributeName="stop-color" values="#1a1a2e;#0d1117;#1a1a2e" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Top wave into footer -->
  <path d="M0,0 Q225,30 450,10 Q675,-10 900,0 L900,140 L0,140 Z" fill="url(#footerBg)"/>

  <!-- Floating particles -->
  <circle r="2" fill="#58a6ff" filter="url(#glow2)">
    <animate attributeName="cx" values="100;130;90;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;70;110;90" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.8;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#d2a8ff">
    <animate attributeName="cx" values="800;770;820;800" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;60;100;80" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.9;0.7" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#79c0ff" filter="url(#glow2)">
    <animate attributeName="cx" values="450;480;430;450" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;100;130;120" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.3;0.5" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer Quote -->
  <text x="450" y="62" text-anchor="middle"
        font-family="'Segoe UI', monospace" font-size="16" font-weight="700"
        fill="#ffffff" filter="url(#glow2)">
    ✨ "Data is the new oil — I'm here to refine it into gold." ✨
  </text>

  <!-- Star message -->
  <text x="450" y="92" text-anchor="middle"
        font-family="'Segoe UI', monospace" font-size="13"
        fill="#58a6ff">
    ⭐ If you found my work useful, star my repos! It motivates me to keep building 🙏
  </text>

  <!-- Animated bottom line -->
  <rect x="200" y="108" width="500" height="1.5" rx="1" fill="#1f6feb" opacity="0.5">
    <animate attributeName="width" values="500;400;500" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="200;250;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
