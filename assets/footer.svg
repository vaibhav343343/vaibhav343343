<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <!-- Clean dark gradient background -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Subtle accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="120" fill="url(#footerBg)"/>

  <!-- Subtle grid texture — very faint -->
  <g stroke="#21262d" stroke-width="1" opacity="0.4">
    <line x1="0" y1="40"  x2="900" y2="40"/>
    <line x1="0" y1="80"  x2="900" y2="80"/>
    <line x1="225" y1="0" x2="225" y2="120"/>
    <line x1="450" y1="0" x2="450" y2="120"/>
    <line x1="675" y1="0" x2="675" y2="120"/>
  </g>

  <!-- Accent Line top -->
  <rect x="225" y="0" width="450" height="1" fill="url(#accentLine)" opacity="0.5"/>

  <!-- Main Quote -->
  <text x="450" y="55" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400"
        fill="#c9d1d9">
    "Data is the new oil — I'm here to refine it into intelligence."
  </text>

  <!-- Social links text -->
  <text x="450" y="85" text-anchor="middle"
        font-family="'Segoe UI', monospace" font-size="12"
        fill="#8b949e">
    GitHub  ·  LinkedIn  ·  Kaggle  ·  Email
  </text>
  
  <!-- Subtle attribution -->
  <text x="450" y="105" text-anchor="middle"
        font-family="'Segoe UI', monospace" font-size="10"
        fill="#484f58">
    Vaibhav Sudrik © 2026
  </text>
</svg>
