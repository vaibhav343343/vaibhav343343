<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <!-- Dark premium background gradient -->
    <linearGradient id="aiNNbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408">
        <animate attributeName="stop-color" values="#020408;#050d1a;#020408" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#0a1628">
        <animate attributeName="stop-color" values="#0a1628;#0f2a4a;#0a1628" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10052a">
        <animate attributeName="stop-color" values="#10052a;#0d1117;#10052a" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Node gradients -->
    <radialGradient id="nBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="nPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="nCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="nGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <!-- Glow filters -->
    <filter id="strongGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Marker for arrow on connection lines -->
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="18" fill="url(#aiNNbg)" stroke="#1f3a6e" stroke-width="1.5"/>

  <!-- Subtle grid lines -->
  <g stroke="#0f2040" stroke-width="0.8" opacity="0.7">
    <line x1="0" y1="56"  x2="900" y2="56"/><line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/><line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="150" y1="0" x2="150" y2="280"/><line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/><line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
  </g>

  <!-- ═══════ NEURAL NETWORK DIAGRAM ═══════ -->

  <!-- INPUT → HIDDEN1 static dim connections -->
  <g stroke="#3b82f6" stroke-width="0.8" opacity="0.15">
    <line x1="80" y1="70"  x2="220" y2="70"/><line x1="80" y1="70"  x2="220" y2="120"/>
    <line x1="80" y1="70"  x2="220" y2="170"/><line x1="80" y1="70"  x2="220" y2="220"/>
    <line x1="80" y1="120" x2="220" y2="70"/><line x1="80" y1="120" x2="220" y2="120"/>
    <line x1="80" y1="120" x2="220" y2="170"/><line x1="80" y1="120" x2="220" y2="220"/>
    <line x1="80" y1="170" x2="220" y2="70"/><line x1="80" y1="170" x2="220" y2="120"/>
    <line x1="80" y1="170" x2="220" y2="170"/><line x1="80" y1="170" x2="220" y2="220"/>
    <line x1="80" y1="220" x2="220" y2="70"/><line x1="80" y1="220" x2="220" y2="120"/>
    <line x1="80" y1="220" x2="220" y2="170"/><line x1="80" y1="220" x2="220" y2="220"/>
  </g>
  <!-- HIDDEN1 → HIDDEN2 pulsing connections -->
  <g stroke="#a855f7" stroke-width="0.9">
    <line x1="232" y1="70"  x2="370" y2="85"  opacity="0.15"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.1s" repeatCount="indefinite"/></line>
    <line x1="232" y1="70"  x2="370" y2="145" opacity="0.15"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="232" y1="70"  x2="370" y2="205" opacity="0.15"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="232" y1="120" x2="370" y2="85"  opacity="0.15"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="232" y1="120" x2="370" y2="145" opacity="0.15"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="232" y1="120" x2="370" y2="205" opacity="0.15"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.0s" repeatCount="indefinite"/></line>
    <line x1="232" y1="170" x2="370" y2="85"  opacity="0.15"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="232" y1="170" x2="370" y2="145" opacity="0.15"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="232" y1="170" x2="370" y2="205" opacity="0.15"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="232" y1="220" x2="370" y2="85"  opacity="0.15"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="232" y1="220" x2="370" y2="145" opacity="0.15"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.7s" repeatCount="indefinite"/></line>
    <line x1="232" y1="220" x2="370" y2="205" opacity="0.15"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></line>
  </g>
  <!-- HIDDEN2 → HIDDEN3 pulsing connections -->
  <g stroke="#22d3ee" stroke-width="0.9">
    <line x1="382" y1="85"  x2="510" y2="100" opacity="0.15"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="382" y1="85"  x2="510" y2="180" opacity="0.15"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="382" y1="145" x2="510" y2="100" opacity="0.15"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="382" y1="145" x2="510" y2="180" opacity="0.15"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.7s" repeatCount="indefinite"/></line>
    <line x1="382" y1="205" x2="510" y2="100" opacity="0.15"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="382" y1="205" x2="510" y2="180" opacity="0.15"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.0s" repeatCount="indefinite"/></line>
  </g>
  <!-- HIDDEN3 → OUTPUT pulsing connections -->
  <g stroke="#4ade80" stroke-width="1">
    <line x1="522" y1="100" x2="620" y2="120" opacity="0.15"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="522" y1="100" x2="620" y2="160" opacity="0.15"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="522" y1="180" x2="620" y2="120" opacity="0.15"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="522" y1="180" x2="620" y2="160" opacity="0.15"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.7s" repeatCount="indefinite"/></line>
  </g>

  <!-- ═══ DATA FLOW DOTS (animated signals along network paths) ═══ -->
  <!-- Flow A -->
  <circle r="4" fill="#58a6ff" filter="url(#strongGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M80,70 L220,120 L370,85 L510,100 L620,120"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Flow B -->
  <circle r="3.5" fill="#c084fc" filter="url(#strongGlow)">
    <animateMotion dur="3.8s" begin="0.7s" repeatCount="indefinite" path="M80,170 L220,220 L370,205 L510,180 L620,160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.8s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <!-- Flow C -->
  <circle r="3" fill="#34d399" filter="url(#strongGlow)">
    <animateMotion dur="2.9s" begin="1.4s" repeatCount="indefinite" path="M80,220 L220,70 L370,145 L510,100 L620,120"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.9s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Flow D -->
  <circle r="3" fill="#fb923c" filter="url(#softGlow)">
    <animateMotion dur="4.1s" begin="2.1s" repeatCount="indefinite" path="M80,120 L220,170 L370,85 L510,180 L620,160"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4.1s" begin="2.1s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ INPUT LAYER ═══ -->
  <g filter="url(#softGlow)">
    <circle cx="80" cy="70"  r="11" fill="url(#nBlue)" stroke="#58a6ff" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="120" r="11" fill="url(#nBlue)" stroke="#58a6ff" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="170" r="11" fill="url(#nBlue)" stroke="#58a6ff" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="220" r="11" fill="url(#nBlue)" stroke="#58a6ff" stroke-width="2"><animate attributeName="r" values="11;13;11" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ HIDDEN LAYER 1 ═══ -->
  <g filter="url(#softGlow)">
    <circle cx="226" cy="70"  r="11" fill="url(#nPurple)" stroke="#a855f7" stroke-width="2"><animate attributeName="r" values="11;13.5;11" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="226" cy="120" r="11" fill="url(#nPurple)" stroke="#a855f7" stroke-width="2"><animate attributeName="r" values="11;13.5;11" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="226" cy="170" r="11" fill="url(#nPurple)" stroke="#a855f7" stroke-width="2"><animate attributeName="r" values="11;13.5;11" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="226" cy="220" r="11" fill="url(#nPurple)" stroke="#a855f7" stroke-width="2"><animate attributeName="r" values="11;13.5;11" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ HIDDEN LAYER 2 ═══ -->
  <g filter="url(#softGlow)">
    <circle cx="376" cy="85"  r="11" fill="url(#nPurple)" stroke="#c084fc" stroke-width="2"><animate attributeName="r" values="11;14;11" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="376" cy="145" r="11" fill="url(#nPurple)" stroke="#c084fc" stroke-width="2"><animate attributeName="r" values="11;14;11" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="376" cy="205" r="11" fill="url(#nPurple)" stroke="#c084fc" stroke-width="2"><animate attributeName="r" values="11;14;11" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ HIDDEN LAYER 3 (CYAN) ═══ -->
  <g filter="url(#softGlow)">
    <circle cx="516" cy="100" r="11" fill="url(#nCyan)" stroke="#22d3ee" stroke-width="2"><animate attributeName="r" values="11;13.5;11" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="516" cy="180" r="11" fill="url(#nCyan)" stroke="#22d3ee" stroke-width="2"><animate attributeName="r" values="11;13.5;11" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ OUTPUT LAYER ═══ -->
  <g filter="url(#strongGlow)">
    <circle cx="624" cy="120" r="13" fill="url(#nGreen)" stroke="#4ade80" stroke-width="2.5">
      <animate attributeName="r" values="13;16;13" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="624" cy="160" r="13" fill="url(#nGreen)" stroke="#4ade80" stroke-width="2.5">
      <animate attributeName="r" values="13;16;13" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ═══ LAYER LABELS ═══ -->
  <g font-family="'Segoe UI', monospace" opacity="0.85">
    <text x="80"  y="250" text-anchor="middle" font-size="10" fill="#58a6ff">Input</text>
    <text x="226" y="248" text-anchor="middle" font-size="10" fill="#a855f7">Hidden 1</text>
    <text x="376" y="232" text-anchor="middle" font-size="10" fill="#c084fc">Hidden 2</text>
    <text x="516" y="210" text-anchor="middle" font-size="10" fill="#22d3ee">Hidden 3</text>
    <text x="624" y="190" text-anchor="middle" font-size="10" fill="#4ade80">Output</text>
  </g>

  <!-- ═══ STATS / METRICS PANEL (right side) ═══ -->
  <!-- Panel background -->
  <rect x="670" y="30" width="210" height="220" rx="12" fill="#0a1628" stroke="#1f3a6e" stroke-width="1.2"/>

  <!-- Panel title -->
  <text x="775" y="58" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#58a6ff" filter="url(#softGlow)">⚡ AI/ML Stack</text>

  <!-- Metric bars -->
  <!-- Python -->
  <text x="688" y="82" font-family="monospace" font-size="10" fill="#c9d1d9">Python</text>
  <rect x="688" y="86" width="174" height="7" rx="3.5" fill="#161b22"/>
  <rect x="688" y="86" width="0" height="7" rx="3.5" fill="#3b82f6">
    <animate attributeName="width" values="0;165" dur="1.5s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="870" y="94" text-anchor="end" font-family="monospace" font-size="9" fill="#58a6ff">95%</text>

  <!-- TensorFlow -->
  <text x="688" y="112" font-family="monospace" font-size="10" fill="#c9d1d9">TensorFlow</text>
  <rect x="688" y="116" width="174" height="7" rx="3.5" fill="#161b22"/>
  <rect x="688" y="116" width="0" height="7" rx="3.5" fill="#a855f7">
    <animate attributeName="width" values="0;139" dur="1.5s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="870" y="124" text-anchor="end" font-family="monospace" font-size="9" fill="#a855f7">80%</text>

  <!-- AWS -->
  <text x="688" y="142" font-family="monospace" font-size="10" fill="#c9d1d9">AWS Cloud</text>
  <rect x="688" y="146" width="174" height="7" rx="3.5" fill="#161b22"/>
  <rect x="688" y="146" width="0" height="7" rx="3.5" fill="#22d3ee">
    <animate attributeName="width" values="0;130" dur="1.5s" begin="1.1s" fill="freeze"/>
  </rect>
  <text x="870" y="154" text-anchor="end" font-family="monospace" font-size="9" fill="#22d3ee">75%</text>

  <!-- Spark -->
  <text x="688" y="172" font-family="monospace" font-size="10" fill="#c9d1d9">Spark/Hadoop</text>
  <rect x="688" y="176" width="174" height="7" rx="3.5" fill="#161b22"/>
  <rect x="688" y="176" width="0" height="7" rx="3.5" fill="#f59e0b">
    <animate attributeName="width" values="0;122" dur="1.5s" begin="1.4s" fill="freeze"/>
  </rect>
  <text x="870" y="184" text-anchor="end" font-family="monospace" font-size="9" fill="#f59e0b">70%</text>

  <!-- Gen AI / LLMs -->
  <text x="688" y="202" font-family="monospace" font-size="10" fill="#c9d1d9">Gen AI / LLMs</text>
  <rect x="688" y="206" width="174" height="7" rx="3.5" fill="#161b22"/>
  <rect x="688" y="206" width="0" height="7" rx="3.5" fill="#4ade80">
    <animate attributeName="width" values="0;113" dur="1.5s" begin="1.7s" fill="freeze"/>
  </rect>
  <text x="870" y="214" text-anchor="end" font-family="monospace" font-size="9" fill="#4ade80">65%</text>

  <!-- Power BI -->
  <text x="688" y="232" font-family="monospace" font-size="10" fill="#c9d1d9">Power BI</text>
  <rect x="688" y="236" width="174" height="7" rx="3.5" fill="#161b22"/>
  <rect x="688" y="236" width="0" height="7" rx="3.5" fill="#fb923c">
    <animate attributeName="width" values="0;148" dur="1.5s" begin="2.0s" fill="freeze"/>
  </rect>
  <text x="870" y="244" text-anchor="end" font-family="monospace" font-size="9" fill="#fb923c">85%</text>

  <!-- ═══ TITLE BANNER AT BOTTOM ═══ -->
  <rect x="20" y="255" width="630" height="18" rx="9" fill="#0d1117" opacity="0.7"/>
  <text x="335" y="268" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="12" font-weight="700" fill="#58a6ff" filter="url(#titleGlow)">
    🧠 Deep Neural Network  ·  AI / ML Architecture  ·  Data Science
  </text>

  <!-- ═══ FLOATING PARTICLES ═══ -->
  <circle r="2.2" fill="#58a6ff" filter="url(#softGlow)">
    <animate attributeName="cx" values="22;38;18;22" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="22;38;15;22" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.9;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#c084fc">
    <animate attributeName="cx" values="640;620;655;640" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="26;42;18;26" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.3;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#34d399" filter="url(#softGlow)">
    <animate attributeName="cx" values="350;370;335;350" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="16;32;10;16" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.85;0.2;0.4" dur="11s" repeatCount="indefinite"/>
  </circle>
</svg>
