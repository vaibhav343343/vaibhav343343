<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="nnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Node fills -->
    <radialGradient id="nodeIn" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="nodeH" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="nodeOut" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <!-- Minimal glow -->
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="12" fill="url(#nnBg)" stroke="#21262d" stroke-width="1"/>

  <!-- Subtle grid -->
  <g stroke="#161b22" stroke-width="1" opacity="1">
    <line x1="0" y1="60"  x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="540" y1="0" x2="540" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- ═══ NEURAL NETWORK — INPUT → H1 connections ═══ -->
  <g stroke="#2f81f7" stroke-width="0.8" opacity="0.18">
    <line x1="90" y1="60"  x2="230" y2="52"/><line x1="90" y1="60"  x2="230" y2="100"/>
    <line x1="90" y1="60"  x2="230" y2="148"/><line x1="90" y1="60"  x2="230" y2="196"/>
    <line x1="90" y1="120" x2="230" y2="52"/><line x1="90" y1="120" x2="230" y2="100"/>
    <line x1="90" y1="120" x2="230" y2="148"/><line x1="90" y1="120" x2="230" y2="196"/>
    <line x1="90" y1="180" x2="230" y2="52"/><line x1="90" y1="180" x2="230" y2="100"/>
    <line x1="90" y1="180" x2="230" y2="148"/><line x1="90" y1="180" x2="230" y2="196"/>
  </g>

  <!-- H1 → H2 connections with clean fade pulse -->
  <g stroke="#8957e5" stroke-width="0.8">
    <line x1="242" y1="52"  x2="370" y2="76"  opacity="0.12"><animate attributeName="opacity" values="0.12;0.55;0.12" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="242" y1="52"  x2="370" y2="164" opacity="0.12"><animate attributeName="opacity" values="0.12;0.4;0.12"  dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="242" y1="100" x2="370" y2="76"  opacity="0.12"><animate attributeName="opacity" values="0.12;0.5;0.12"  dur="2.0s" repeatCount="indefinite"/></line>
    <line x1="242" y1="100" x2="370" y2="164" opacity="0.12"><animate attributeName="opacity" values="0.12;0.6;0.12"  dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="242" y1="148" x2="370" y2="76"  opacity="0.12"><animate attributeName="opacity" values="0.12;0.45;0.12" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="242" y1="148" x2="370" y2="164" opacity="0.12"><animate attributeName="opacity" values="0.12;0.55;0.12" dur="3.0s" repeatCount="indefinite"/></line>
    <line x1="242" y1="196" x2="370" y2="76"  opacity="0.12"><animate attributeName="opacity" values="0.12;0.5;0.12"  dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="242" y1="196" x2="370" y2="164" opacity="0.12"><animate attributeName="opacity" values="0.12;0.4;0.12"  dur="2.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- H2 → Output connections -->
  <g stroke="#3fb950" stroke-width="0.9">
    <line x1="382" y1="76"  x2="500" y2="120" opacity="0.12"><animate attributeName="opacity" values="0.12;0.6;0.12" dur="2.1s" repeatCount="indefinite"/></line>
    <line x1="382" y1="164" x2="500" y2="120" opacity="0.12"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="2.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- ═══ SIGNAL DOTS — smooth, single-path ═══ -->
  <!-- Signal 1 -->
  <circle r="3.5" fill="#2f81f7" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M90,60 L230,100 L370,76 L500,120"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Signal 2 -->
  <circle r="3" fill="#8957e5" filter="url(#glow)">
    <animateMotion dur="3.4s" begin="1s" repeatCount="indefinite"
      path="M90,180 L230,148 L370,164 L500,120"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="3.4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <!-- Signal 3 -->
  <circle r="2.5" fill="#3fb950" filter="url(#glow)">
    <animateMotion dur="2.8s" begin="1.8s" repeatCount="indefinite"
      path="M90,120 L230,52 L370,76 L500,120"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ INPUT NODES ═══ -->
  <circle cx="90" cy="60"  r="10" fill="url(#nodeIn)" stroke="#2f81f7" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;11.5;10" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="120" r="10" fill="url(#nodeIn)" stroke="#2f81f7" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;11.5;10" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="180" r="10" fill="url(#nodeIn)" stroke="#2f81f7" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;11.5;10" dur="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ HIDDEN LAYER 1 ═══ -->
  <circle cx="236" cy="52"  r="10" fill="url(#nodeH)" stroke="#8957e5" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;11.5;10" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="236" cy="100" r="10" fill="url(#nodeH)" stroke="#8957e5" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;11.5;10" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="236" cy="148" r="10" fill="url(#nodeH)" stroke="#8957e5" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;11.5;10" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="236" cy="196" r="10" fill="url(#nodeH)" stroke="#8957e5" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;11.5;10" dur="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ HIDDEN LAYER 2 ═══ -->
  <circle cx="376" cy="76"  r="10" fill="url(#nodeH)" stroke="#a371f7" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;12;10" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="376" cy="164" r="10" fill="url(#nodeH)" stroke="#a371f7" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="r" values="10;12;10" dur="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ OUTPUT NODE ═══ -->
  <circle cx="504" cy="120" r="12" fill="url(#nodeOut)" stroke="#3fb950" stroke-width="2" filter="url(#glow)">
    <animate attributeName="r" values="12;14;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer labels -->
  <text x="90"  y="218" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">Input</text>
  <text x="236" y="218" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">Hidden 1</text>
  <text x="376" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">Hidden 2</text>
  <text x="504" y="148" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">Output</text>

  <!-- ═══ RIGHT SIDE — Skill bars panel ═══ -->
  <rect x="570" y="20" width="300" height="200" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="720" y="46" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">⚡ Skill Proficiency</text>

  <!-- Python -->
  <text x="588" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Python</text>
  <rect x="588" y="76" width="264" height="6" rx="3" fill="#21262d"/>
  <rect x="588" y="76" width="0"   height="6" rx="3" fill="#2f81f7">
    <animate attributeName="width" values="0;251" dur="1.2s" begin="0.4s" fill="freeze"/>
  </rect>

  <!-- TensorFlow -->
  <text x="588" y="102" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">TensorFlow / PyTorch</text>
  <rect x="588" y="106" width="264" height="6" rx="3" fill="#21262d"/>
  <rect x="588" y="106" width="0"   height="6" rx="3" fill="#8957e5">
    <animate attributeName="width" values="0;211" dur="1.2s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- AWS -->
  <text x="588" y="132" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">AWS Cloud</text>
  <rect x="588" y="136" width="264" height="6" rx="3" fill="#21262d"/>
  <rect x="588" y="136" width="0"   height="6" rx="3" fill="#f7931a">
    <animate attributeName="width" values="0;198" dur="1.2s" begin="0.8s" fill="freeze"/>
  </rect>

  <!-- Spark -->
  <text x="588" y="162" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Spark / Hadoop</text>
  <rect x="588" y="166" width="264" height="6" rx="3" fill="#21262d"/>
  <rect x="588" y="166" width="0"   height="6" rx="3" fill="#e25a1c">
    <animate attributeName="width" values="0;185" dur="1.2s" begin="1.0s" fill="freeze"/>
  </rect>

  <!-- Gen AI -->
  <text x="588" y="192" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Gen AI / LLMs</text>
  <rect x="588" y="196" width="264" height="6" rx="3" fill="#21262d"/>
  <rect x="588" y="196" width="0"   height="6" rx="3" fill="#3fb950">
    <animate attributeName="width" values="0;172" dur="1.2s" begin="1.2s" fill="freeze"/>
  </rect>
</svg>
